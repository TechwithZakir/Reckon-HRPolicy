[project]
name = "reckon_hr_policy"
description = "Configurable attendance and payroll policies for Frappe HR v16"
authors = [{name = "Reckon"}]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
dynamic = ["version"]

[build-system]
requires = ["flit_core>=3.9,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.sdist]
include = ["tools/", "docs/", "requirements.txt", "requirements-dev.txt", "COPYING"]

[tool.bench.frappe-dependencies]
frappe = ">=16.33.1,<17.0.0"
erpnext = ">=16.34.2,<17.0.0"
hrms = ">=16.18.1,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
