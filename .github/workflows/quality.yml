name: Standalone quality checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest reckon_hr_policy.tests.test_policy reckon_hr_policy.tests.test_metadata reckon_hr_policy.tests.test_effectiveness reckon_hr_policy.tests.test_grade_policy -v
      - run: python -m compileall -q reckon_hr_policy tools
      - run: ruff check reckon_hr_policy tools
      - run: ruff format --check reckon_hr_policy tools
      - run: python -m build --no-isolation
      - run: python tools/verify_artifacts.py
